map $http_upgrade $conn_up { default upgrade; '' close; }
# ⚡ XHTTP sends many small requests: keep warm connections to Xray instead of opening a new one each time
upstream jinx_xhttp { server 127.0.0.1:2006 max_fails=0; keepalive 128; keepalive_requests 100000; keepalive_timeout 300s; }
upstream jinx_xhttp_su { server 127.0.0.1:2007 max_fails=0; keepalive 64; keepalive_requests 100000; keepalive_timeout 300s; }
server {
  listen 8080 reuseport backlog=4096;
  include /etc/nginx/jinx-port.inc;
  tcp_nodelay on;
  keepalive_requests 100000;        # Railway's edge reuses one connection for thousands of requests (no re-handshakes)
  keepalive_timeout 300s;
  absolute_redirect off;            # redirects stay relative: never leak the internal :8080 port or http://
  proxy_buffering off;
  proxy_request_buffering off;
  # healthcheck goes through to the real panel, so a broken panel = failed deploy (not a silent bug)
  location = /health { access_log off; proxy_pass http://127.0.0.1:8000/dashboard/; }
  location = / { return 302 /dashboard/; }
  # 🩺 live status of every part (written by doctor.py every 15s)
  location = /jx-status { access_log off; alias /run/jinx/status.json; default_type application/json; charset utf-8; add_header Cache-Control "no-store"; }

  # ⚡ Super JinX responsive skin for the dashboard (desktop + mobile)
  location = /jinx.css { alias /opt/jinx/jinx.css; default_type text/css; add_header Cache-Control "no-cache"; }
  location = /jinx.js  { alias /opt/jinx/jinx.js;  default_type application/javascript; add_header Cache-Control "no-cache"; }
  # 🚪 reseller entrance: remembers "reseller" on this device, then opens the normal login (shows «به پنل نمایندگی خوش آمدید»)
  location = /agent { return 302 /agent/; }
  location = /agent/ { default_type text/html; charset utf-8; add_header Cache-Control "no-store";
    return 200 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super JinX</title><body style="background:#1a202c"><script>try{localStorage.setItem("jinx-agent","1")}catch(e){}location.replace("/dashboard/")</script><noscript><a href="/dashboard/">Login</a></noscript></body>'; }
  # 💎 donation page (حمایت مالی). Addresses live only in donate-config.js
  #    (/donate/ ends with "/", so it is served with try_files: alias would make nginx look for an index file -> 404)
  location = /donate { return 301 /donate/; }
  location = /donate/ { root /opt/jinx; try_files /donate.html @jinx_donate; default_type text/html; charset utf-8; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy no-referrer; }
  location = /donate/config.js { root /opt/jinx; try_files /donate-config.js @jinx_doncfg; default_type application/javascript; charset utf-8; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; }
  # backup: if the files are ever missing, the account service serves the page (from its golden copy)
  location @jinx_donate { rewrite ^ /jinx-api/donate-page break; proxy_pass http://127.0.0.1:8090; }
  location @jinx_doncfg { rewrite ^ /jinx-api/donate-config.js break; proxy_pass http://127.0.0.1:8090; }
  location = /donate/index.html { return 301 /donate/; }
  location = /donate.html { return 301 /donate/; }
  location /jinx-fonts/ { alias /opt/jinx/fonts/; types { font/woff2 woff2; } add_header Cache-Control "public, max-age=31536000"; }
  location /dashboard/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7c5cff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="/jinx.css?v=7"><script src="/jinx.js?v=7"></script></head>';
  }
  # 🔗 the panel's GitHub button / footer link -> Super JinX GitHub (only these two links change, nothing else)
  location /dashboard/assets/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_set_header If-None-Match "";          # always a fresh, rewritten copy (old cached copies are replaced)
    proxy_set_header If-Modified-Since "";
    proxy_hide_header ETag;
    proxy_hide_header Last-Modified;
    add_header Cache-Control "public, max-age=86400";
    sub_filter_types application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"https://github.com/Gozargah/Marzban"' '"https://github.com/x4gpanell"';
    sub_filter '"https://github.com/Gozargah"' '"https://github.com/x4gpanell"';
  }
  # 🔐 secret config paths (the same style as SuperJinX: /cdn/<random id>), made once per panel and kept forever.
  #    Anything else under /cdn/ goes to the panel = a plain 404 page, so a scanner never finds the configs.
  location = __JXB__   { proxy_pass http://127.0.0.1:2004; include /etc/nginx/ws.inc; }
  location = __JXB__/v { proxy_pass http://127.0.0.1:2001; include /etc/nginx/ws.inc; }
  location = __JXB__/m { proxy_pass http://127.0.0.1:2002; include /etc/nginx/ws.inc; }
  location = __JXB__/t { proxy_pass http://127.0.0.1:2003; include /etc/nginx/ws.inc; }
  # ⚡ fast transports (only active when lock.py enabled them for this Xray version)
  location = __JXB__/u { proxy_pass http://127.0.0.1:2005; include /etc/nginx/ws.inc; }
  location __JXB__/x {
    proxy_pass http://jinx_xhttp;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_socket_keepalive on;
    client_max_body_size 0;
    client_body_buffer_size 256k;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }
  location __JXB__/s {
    proxy_pass http://jinx_xhttp_su;
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_socket_keepalive on;
    client_max_body_size 0;
    client_body_buffer_size 256k;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }
  # old paths of v12 and before (configs already copied by hand keep working; JINX_OLD_PATHS=0 closes them)
  include /etc/nginx/jinx-old.inc;

  # ⚡ account service (change admin username/password)
  location /jinx-api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Jinx-Remote $remote_addr;
    proxy_set_header X-Jinx-Real $http_x_real_ip;
    proxy_set_header X-Jinx-XFF $http_x_forwarded_for;
    proxy_set_header X-Jinx-CF $http_cf_connecting_ip;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
  }

  # 🤝 reseller panels: only these calls pass through the limit gate (login, create / edit / delete / reset user)
  #    gate down for a moment: login still goes straight to the panel (you are never locked out),
  #    but user changes wait for the gate (a reseller can never pass its limits)
  location = /api/admin/token { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; error_page 502 504 = @panel_direct; }
  location = /api/user        { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; error_page 502 504 = @gate_down; }
  location ~ ^/api/user/[^/]+(/reset|/revoke_sub)?$ { proxy_pass http://127.0.0.1:8090; include /etc/nginx/gate.inc; error_page 502 504 = @gate_down; }
  location @gate_down { default_type application/json; add_header Retry-After 3 always; return 503 '{"detail":"سرویس در حال راه‌اندازی دوباره است. چند ثانیه دیگر دوباره امتحان کنید."}'; }
  location @panel_direct {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Core config is read-only from the panel (protects the locked inbound)
  location = /api/core/config {
    if ($request_method != GET) { return 403; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # dashboard live logs (websocket)
    proxy_set_header Connection $conn_up;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
