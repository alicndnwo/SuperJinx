<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#7c5cff"/><stop offset="0.5" stop-color="#5b8cff"/><stop offset="1" stop-color="#00d4a6"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>

<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset="0.2" stop-color="#7c5cff"/><stop offset="0.5" stop-color="#5b8cff"/><stop offset="0.8" stop-color="#00d4a6"/><stop offset="1" stop-color="#00d4a6" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#fade)" opacity="0.6"/>
<rect y="9" width="160" height="6" rx="3" fill="#fff" filter="url(#glow)" opacity="0.9"><animate attributeName="x" values="-200;1240" dur="3.6s" repeatCount="indefinite"/></rect>
<circle cx="600" cy="12" r="5" fill="#00d4a6" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
</svg>
